spring:
  application:
    name: interview-copilot_backend
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview_copilot}
    username: ${DATABASE_USER:interview_copilot}
    password: ${DATABASE_PASSWORD:CHANGE_ME}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss is validated against the public issuer; keys are fetched over the internal URL.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/interview-copilot}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8081/realms/interview-copilot/protocol/openid-connect/certs}

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

speech:
  deepgram:
    api-key: ${DEEPGRAM_API_KEY:}
    base-url: ${DEEPGRAM_BASE_URL:https://api.deepgram.com}
    token-ttl-seconds: ${STT_TOKEN_TTL_SECONDS:60}

accounts:
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@interview-copilot.local}
  reset-ttl-minutes: ${RESET_TTL_MINUTES:30}

identity:
  keycloak:
    admin-base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8081/admin/realms/interview-copilot}
    token-uri: ${IDP_ADMIN_TOKEN_URI:http://localhost:8081/realms/master/protocol/openid-connect/token}
    client-id: ${IDP_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${IDP_ADMIN_CLIENT_SECRET:}
    username: ${IDP_ADMIN_USERNAME:}
    password: ${IDP_ADMIN_PASSWORD:}
